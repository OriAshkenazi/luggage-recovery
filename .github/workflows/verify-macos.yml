name: Verify macOS (3.11)

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: verify-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard against dark mode hooks
        run: |
          set -euo pipefail
          # Search for dark-mode hooks in recovery UI assets
          if grep -R -nE "prefers-color-scheme|data-theme=\"dark\"|:root\\.dark|(^|[^-])\\.dark([^a-zA-Z0-9_-]|$)|theme-dark" docs/; then
            echo "Found dark-mode related patterns. Light-only policy violation." >&2
            exit 1
          fi
      - name: Verify HTML meta for light theme
        run: |
          python - << 'PY'
          import sys, re
          from pathlib import Path
          html = Path('docs/index.html').read_text(encoding='utf-8')
          has_color_scheme = re.search(r'<meta[^>]+name=["\']color-scheme["\'][^>]+content=["\']light["\']', html, re.I)
          if not has_color_scheme:
            print('Missing <meta name="color-scheme" content="light">', file=sys.stderr)
            sys.exit(1)
          m = re.search(r'<meta[^>]+name=["\']theme-color["\'][^>]+content=["\']([^"\']+)["\']', html, re.I)
          if not m:
            print('Missing <meta name="theme-color">', file=sys.stderr)
            sys.exit(1)
          val = m.group(1).strip().lower()
          if not (val == '#fff' or val == '#ffffff' or val == '#ffffff'):
            print(f'theme-color should be light (#fff or #ffffff), got {val}', file=sys.stderr)
            sys.exit(1)
          print('Light meta checks passed')
          PY
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install Assistant font (tag text)
        run: |
          mkdir -p ~/Library/Fonts
          curl -fsSL -o ~/Library/Fonts/Assistant-VariableFont_wght.ttf \
            "https://github.com/google/fonts/raw/main/ofl/assistant/Assistant%5Bwght%5D.ttf"
      - name: Contrast check tokens
        run: python tools/contrast_check.py tokens/buttons.json
      - name: Tests
        env:
          RECOVERY_SECRET: CI_SECRET
        run: pytest -q
      - name: Generate the two-part tag twice (placeholder contact)
        run: |
          python 3d-models/two_part_tag.py --contact /dev/null --out 3d-models/outputs/a
          python 3d-models/two_part_tag.py --contact /dev/null --out 3d-models/outputs/b
      - name: Compare checksums for determinism
        run: |
          python - << 'PY'
          import json, sys, pathlib
          a = json.loads(pathlib.Path('3d-models/outputs/a/manifest.json').read_text())['files']
          b = json.loads(pathlib.Path('3d-models/outputs/b/manifest.json').read_text())['files']
          diffs = [k for k in a if a[k] != b.get(k)]
          if diffs:
            print('Non-deterministic outputs for:', ', '.join(diffs))
            sys.exit(1)
          print('Determinism check passed for', len(a), 'files')
          PY
      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: two-part-tag-macos-3.11
          path: 3d-models/outputs/a/
          retention-days: 10
